[project]
name = "mcp-qemu"
version = "0.1.0"
description = "MCP server for QEMU lifecycle management and GDB debugging of BJROS kernel"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pygdbmi>=0.11.0.0",
]

[project.scripts]
mcp-qemu = "server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
